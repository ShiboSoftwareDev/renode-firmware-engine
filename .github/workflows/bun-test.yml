name: Bun Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install
      - run: bun run test
      - name: Run Renode end-to-end test
        run: bun run test:e2e
      - name: Run preloaded ELF end-to-end test
        run: bun run test:preloaded:e2e
      - name: Run interactive Renode session test
        run: bun run test:session:e2e
      - name: Run complete firmware workbench test
        run: bun run test:workbench:e2e
